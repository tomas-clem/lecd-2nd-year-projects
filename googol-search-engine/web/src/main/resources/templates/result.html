<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Getting Started: Serving Web Content</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>

<body>
    <a href="/main" target="_self">
        <h1> Googol </h1>
    </a>
    <pag th="'Query: ' + ${query}" />
    <table>
        <thead>
            <tr>
                <td width="20px"><b>Titulo</b> </td>
                <td><b>URL</b> </td>
                <td><b>Paragrafo</b> </td>
            </tr>
        </thead>
        <tbody>
            <tr th:each="empl, iStat : ${res}" th:style="${iStat.odd}? 'font-weight: bold;'">
                <td width="20px" th:text="${empl.titulo}">
                </td><td th:text="${empl.url}">
            </td><td th:text="${empl.parag}">
            </td></tr>
        </tbody>
    </table>
    <a th:href="@{search(query=${query},page=${page-1})}" th:text="Back"></a>
    <a th:href="@{search(query=${query},page=${page+1})}" th:text="Next"></a>

</body>
</html>
